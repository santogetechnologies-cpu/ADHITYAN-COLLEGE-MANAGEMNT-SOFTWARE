<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="colGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="winGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
  </defs>

  <!-- Sky Backing -->
  <rect width="800" height="450" fill="url(#skyGrad)" rx="16"/>

  <!-- Main Building Base Wing -->
  <rect x="80" y="140" width="640" height="230" fill="url(#wallGrad)" rx="4"/>
  <!-- Wing Cornice -->
  <rect x="70" y="130" width="660" height="15" fill="#B45309" rx="2"/>

  <!-- Left Wing Windows -->
  <g fill="url(#winGrad)" stroke="#78350F" stroke-width="2">
    <rect x="110" y="160" width="36" height="50" rx="18"/>
    <rect x="170" y="160" width="36" height="50" rx="18"/>
    <rect x="230" y="160" width="36" height="50" rx="18"/>
    <rect x="110" y="230" width="36" height="55" rx="3"/>
    <rect x="170" y="230" width="36" height="55" rx="3"/>
    <rect x="230" y="230" width="36" height="55" rx="3"/>
    <rect x="110" y="305" width="36" height="55" rx="3"/>
    <rect x="170" y="305" width="36" height="55" rx="3"/>
    <rect x="230" y="305" width="36" height="55" rx="3"/>
  </g>

  <!-- Right Wing Windows -->
  <g fill="url(#winGrad)" stroke="#78350F" stroke-width="2">
    <rect x="530" y="160" width="36" height="50" rx="18"/>
    <rect x="590" y="160" width="36" height="50" rx="18"/>
    <rect x="650" y="160" width="36" height="50" rx="18"/>
    <rect x="530" y="230" width="36" height="55" rx="3"/>
    <rect x="590" y="230" width="36" height="55" rx="3"/>
    <rect x="650" y="230" width="36" height="55" rx="3"/>
    <rect x="530" y="305" width="36" height="55" rx="3"/>
    <rect x="590" y="305" width="36" height="55" rx="3"/>
    <rect x="650" y="305" width="36" height="55" rx="3"/>
  </g>

  <!-- Central Portico Projecting Body -->
  <rect x="290" y="110" width="220" height="260" fill="url(#wallGrad)"/>

  <!-- Grand Pediment Triangle -->
  <polygon points="400,50 280,110 520,110" fill="url(#roofGrad)"/>
  <polygon points="400,60 295,110 505,110" fill="#FDE68A"/>
  <!-- University Crest Medallion in Pediment -->
  <circle cx="400" cy="90" r="14" fill="#1E3A8A" stroke="#B45309" stroke-width="2"/>
  <path d="M394 88 L400 84 L406 88 L400 92 Z M406 88 V94" stroke="#FDE68A" stroke-width="1.5" fill="none"/>

  <!-- Grand Columns (Classical Colonnade) -->
  <g fill="url(#colGrad)" stroke="#B45309" stroke-width="1.5">
    <rect x="310" y="110" width="16" height="240" rx="2"/>
    <rect x="350" y="110" width="16" height="240" rx="2"/>
    <rect x="392" y="110" width="16" height="240" rx="2"/>
    <rect x="434" y="110" width="16" height="240" rx="2"/>
    <rect x="474" y="110" width="16" height="240" rx="2"/>
  </g>

  <!-- Central Grand Entrance Arch -->
  <path d="M375,370 V290 A25,25 0 0,1 425,290 V370 Z" fill="#1E3A8A" stroke="#B45309" stroke-width="3"/>
  <!-- Front Grand Flight of Steps -->
  <polygon points="260,370 540,370 560,400 240,400" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <polygon points="240,400 560,400 580,420 220,420" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>

  <!-- Landscape Trees Left & Right -->
  <g fill="url(#treeGrad)">
    <circle cx="70" cy="330" r="45"/>
    <circle cx="50" cy="360" r="35"/>
    <circle cx="95" cy="360" r="30"/>
    <circle cx="730" cy="330" r="45"/>
    <circle cx="705" cy="360" r="32"/>
    <circle cx="755" cy="360" r="35"/>
  </g>

  <!-- Tree Trunks -->
  <rect x="66" y="360" width="8" height="50" fill="#78350F" rx="2"/>
  <rect x="726" y="360" width="8" height="50" fill="#78350F" rx="2"/>

  <!-- Manicured Forecourt Green Lawn -->
  <path d="M0,410 Q400,390 800,410 L800,450 L0,450 Z" fill="#166534" opacity="0.8"/>
  <path d="M0,425 Q400,410 800,425 L800,450 L0,450 Z" fill="#14532D"/>
</svg>

