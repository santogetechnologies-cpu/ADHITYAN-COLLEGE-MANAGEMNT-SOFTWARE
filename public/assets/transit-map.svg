<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="busShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" fill="url(#mapBg)"/>

  <!-- Campus Green Parks & Lawns -->
  <path d="M40 30 Q120 10 180 60 Q220 120 160 160 Q80 180 30 120 Z" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1.5"/>
  <path d="M420 40 Q520 20 570 90 Q580 180 500 200 Q430 180 400 110 Z" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1.5"/>
  <path d="M350 260 Q480 230 540 300 Q560 380 460 390 Q340 370 320 310 Z" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1.5"/>

  <!-- Secondary Street Grids -->
  <g stroke="#E2E8F0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="340" x2="600" y2="340"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="460" y1="0" x2="460" y2="400"/>
    <path d="M40 400 L260 220 L400 340 L580 220"/>
  </g>

  <!-- Arterial Main Boulevard (White with subtle shadow) -->
  <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-10 180 Q150 170 260 220 T520 160 L610 160"/>
    <path d="M260 0 L260 220 L300 410"/>
  </g>

  <!-- Bus Transit Route Line (Vibrant Blue with dashed path) -->
  <path d="M30 180 L180 180 L260 220 L400 220 L500 160" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 180 L180 180 L260 220 L400 220 L500 160" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Station Stops Nodes -->
  <g fill="#FFFFFF" stroke="#2563EB" stroke-width="3">
    <!-- Stop 1: South Gate -->
    <circle cx="80" cy="180" r="7"/>
    <!-- Stop 2: Science Block -->
    <circle cx="180" cy="180" r="7"/>
    <!-- Stop 3: Central Library -->
    <circle cx="400" cy="220" r="7"/>
    <!-- Stop 4: Main Academic Entrance -->
    <circle cx="500" cy="160" r="7"/>
  </g>

  <!-- Current Active Bus Position Indicator -->
  <g transform="translate(260, 220)" filter="url(#busShadow)">
    <!-- Pulse Ring -->
    <circle cx="0" cy="0" r="28" fill="#3B82F6" fill-opacity="0.25"/>
    <circle cx="0" cy="0" r="20" fill="#2563EB"/>
    
    <!-- Bus Icon inside marker -->
    <rect x="-9" y="-9" width="18" height="18" rx="3.5" fill="#FFFFFF"/>
    <path d="M-6 -6 L6 -6 C7 -6 8 -5 8 -3 L8 4 C8 6 7 7 6 7 L-6 7 C-7 7 -8 6 -8 4 L-8 -3 C-8 -5 -7 -6 -6 -6 Z" fill="#1D4ED8"/>
    <!-- Windshield -->
    <rect x="-6" y="-4" width="12" height="4" rx="1" fill="#93C5FD"/>
    <!-- Headlights -->
    <circle cx="-5" cy="4" r="1" fill="#FDE047"/>
    <circle cx="5" cy="4" r="1" fill="#FDE047"/>
  </g>

  <!-- Floating Callout Label for Current Bus -->
  <g transform="translate(260, 150)" filter="url(#busShadow)">
    <rect x="-70" y="-18" width="140" height="36" rx="8" fill="#0F172A"/>
    <text x="0" y="-2" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">YOUR BUS</text>
    <text x="0" y="12" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TN-01-B-1234</text>
    <!-- Downward Triangle Pointer -->
    <polygon points="0,24 -7,18 7,18" fill="#0F172A"/>
  </g>
</svg>

