<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="avatarBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0A96D"/>
      <stop offset="100%" stop-color="#C68B59"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Circular Badge Backing -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarBg)"/>

  <!-- Torso & College Hoodie -->
  <path d="M40 195 C40 155 70 145 100 145 C130 145 160 155 160 195 Z" fill="url(#hoodieGrad)"/>
  <!-- Hoodie Collar / T-Shirt Inset -->
  <path d="M85 145 Q100 162 115 145 Z" fill="#F8FAFC"/>
  <!-- Backpack Straps -->
  <path d="M62 152 Q68 185 64 200" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
  <path d="M138 152 Q132 185 136 200" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="88" y="120" width="24" height="30" fill="url(#skinGrad)" rx="6"/>

  <!-- Head Base / Jaw -->
  <path d="M68 85 C68 125 78 138 100 138 C122 138 132 125 132 85 C132 50 120 45 100 45 C80 45 68 50 68 85 Z" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="68" cy="88" rx="6" ry="11" fill="#C68B59"/>
  <ellipse cx="132" cy="88" rx="6" ry="11" fill="#C68B59"/>

  <!-- Thick Hair (Modern Pompadour / College Style) -->
  <path d="M65 75 C60 55 72 38 95 35 C115 32 135 40 135 60 C138 72 132 82 132 82 C132 82 128 65 120 62 C110 58 85 62 75 75 C72 80 68 82 65 75 Z" fill="#1E293B"/>
  <path d="M66 75 C64 68 68 55 82 45 C95 38 115 38 130 45 C122 42 105 44 95 48 C85 52 75 62 70 76 Z" fill="#334155"/>

  <!-- Eyebrows -->
  <path d="M78 72 Q88 68 94 72" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M106 72 Q112 68 122 72" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="86" cy="82" rx="4" ry="4.5" fill="#0F172A"/>
  <circle cx="87.5" cy="80.5" r="1.5" fill="#FFFFFF"/>
  <ellipse cx="114" cy="82" rx="4" ry="4.5" fill="#0F172A"/>
  <circle cx="115.5" cy="80.5" r="1.5" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M100 80 L98 96 Q100 98 103 96" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Cheerful Confident Smile -->
  <path d="M86 106 Q100 120 114 106" stroke="#9A3412" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Teeth -->
  <path d="M89 107 Q100 114 111 107 Q100 109 89 107" fill="#FFFFFF"/>
</svg>

