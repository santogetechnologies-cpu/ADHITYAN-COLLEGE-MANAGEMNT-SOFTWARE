<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" fill="none">
  <defs>
    <linearGradient id="busBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="windowTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Bus Road Shadow -->
  <ellipse cx="300" cy="295" rx="250" ry="20" fill="#0F172A" fill-opacity="0.25"/>

  <!-- Main Chassis Shell -->
  <!-- Aerodynamic Coach Profile -->
  <path d="M80 240 L80 110 C80 85 105 75 140 75 L480 75 C520 75 550 90 555 130 L558 240 C558 255 545 265 530 265 L95 265 C85 265 80 255 80 240 Z" fill="url(#busBody)" stroke="#1E3A8A" stroke-width="2"/>

  <!-- White Aero Styling Accents & Stripes -->
  <path d="M120 200 L545 200 L535 220 L105 220 Z" fill="#FFFFFF" fill-opacity="0.9"/>
  <path d="M140 225 L525 225 L520 232 L130 232 Z" fill="#93C5FD"/>

  <!-- College Transit Branding Text Area -->
  <rect x="200" y="202" width="220" height="15" rx="3" fill="#1E3A8A"/>
  <text x="310" y="213" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="2">CAMPUS TRANSIT EXPRESS</text>

  <!-- Front Windshield & Passenger Panoramic Window Band -->
  <g fill="url(#windowTint)" stroke="#1E293B" stroke-width="2">
    <!-- Front Driver Windshield -->
    <path d="M515 90 L545 130 C548 145 545 170 545 185 L510 185 L510 90 Z" rx="3"/>
    <!-- Passenger Windows Group -->
    <rect x="420" y="90" width="80" height="95" rx="4"/>
    <rect x="330" y="90" width="80" height="95" rx="4"/>
    <rect x="240" y="90" width="80" height="95" rx="4"/>
    <rect x="150" y="90" width="80" height="95" rx="4"/>
    <!-- Rear Small Window -->
    <path d="M95 95 L140 90 L140 185 L95 185 C90 185 88 175 88 165 L88 115 C88 100 90 95 95 95 Z"/>
  </g>

  <!-- Window Reflections / Glare -->
  <path d="M160 95 L200 95 L150 180 L110 180 Z" fill="#FFFFFF" fill-opacity="0.2"/>
  <path d="M250 95 L290 95 L240 180 L200 180 Z" fill="#FFFFFF" fill-opacity="0.2"/>
  <path d="M340 95 L380 95 L330 180 L290 180 Z" fill="#FFFFFF" fill-opacity="0.2"/>

  <!-- Passenger Silhouettes inside -->
  <g fill="#0C4A6E" opacity="0.6">
    <circle cx="280" cy="130" r="12"/>
    <path d="M265 175 C265 150 295 150 295 175 Z"/>
    <circle cx="370" cy="130" r="12"/>
    <path d="M355 175 C355 150 385 150 385 175 Z"/>
  </g>

  <!-- Front Headlight Cluster (Right side in perspective) -->
  <g>
    <path d="M545 220 L556 220 C558 220 558 235 555 240 L540 240 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
    <!-- Glowing Projector Xenon Lens -->
    <circle cx="548" cy="230" r="6" fill="#FFFFFF" stroke="#FDE047" stroke-width="2"/>
    <path d="M535 245 L545 245 L545 252 L535 252 Z" fill="#F97316"/>
  </g>

  <!-- Front Side View Mirror -->
  <path d="M525 110 L555 105 L558 135 L530 135 Z" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <line x1="520" y1="120" x2="530" y2="120" stroke="#0F172A" stroke-width="4"/>

  <!-- Wheel Wells (Cutouts) -->
  <path d="M140 265 A 42 42 0 0 1 224 265 Z" fill="#0F172A"/>
  <path d="M420 265 A 42 42 0 0 1 504 265 Z" fill="#0F172A"/>

  <!-- Rear Wheel Assembly -->
  <circle cx="182" cy="265" r="38" fill="url(#wheelGrad)" stroke="#1E293B" stroke-width="3"/>
  <circle cx="182" cy="265" r="24" fill="url(#rimGrad)" stroke="#64748B" stroke-width="2"/>
  <circle cx="182" cy="265" r="10" fill="#0F172A"/>
  <!-- Lug nuts -->
  <circle cx="182" cy="255" r="2.5" fill="#475569"/>
  <circle cx="192" cy="265" r="2.5" fill="#475569"/>
  <circle cx="182" cy="275" r="2.5" fill="#475569"/>
  <circle cx="172" cy="265" r="2.5" fill="#475569"/>

  <!-- Front Wheel Assembly -->
  <circle cx="462" cy="265" r="38" fill="url(#wheelGrad)" stroke="#1E293B" stroke-width="3"/>
  <circle cx="462" cy="265" r="24" fill="url(#rimGrad)" stroke="#64748B" stroke-width="2"/>
  <circle cx="462" cy="265" r="10" fill="#0F172A"/>
  <!-- Lug nuts -->
  <circle cx="462" cy="255" r="2.5" fill="#475569"/>
  <circle cx="472" cy="265" r="2.5" fill="#475569"/>
  <circle cx="462" cy="275" r="2.5" fill="#475569"/>
  <circle cx="452" cy="265" r="2.5" fill="#475569"/>

  <!-- Roof Air Conditioning Unit -->
  <rect x="220" y="60" width="160" height="15" rx="5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="240" y1="67" x2="360" y2="67" stroke="#94A3B8" stroke-width="2"/>

  <!-- Registration Plate -->
  <rect x="525" y="252" width="28" height="10" rx="1.5" fill="#FACC15" stroke="#CA8A04" stroke-width="0.8"/>
  <text x="539" y="259" fill="#000000" font-family="monospace" font-size="5" font-weight="bold" text-anchor="middle">TN-01</text>
</svg>

